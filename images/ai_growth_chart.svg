<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" fill="white"/>

  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">AI in Healthcare Publications (1995-2023)</text>

  <!-- Axes -->
  <line x1="80" y1="350" x2="750" y2="350" stroke="#666" stroke-width="2"/>
  <line x1="80" y1="350" x2="80" y2="80" stroke="#666" stroke-width="2"/>

  <!-- Y-axis labels -->
  <text x="70" y="355" font-family="Arial" font-size="12" fill="#666" text-anchor="end">0</text>
  <text x="70" y="290" font-family="Arial" font-size="12" fill="#666" text-anchor="end">1,000</text>
  <text x="70" y="225" font-family="Arial" font-size="12" fill="#666" text-anchor="end">2,000</text>
  <text x="70" y="160" font-family="Arial" font-size="12" fill="#666" text-anchor="end">3,000</text>
  <text x="70" y="95" font-family="Arial" font-size="12" fill="#666" text-anchor="end">5,000+</text>

  <!-- Bars -->
  <!-- 1995: 15 -->
  <rect x="100" y="345" width="80" height="5" fill="#0088CC"/>
  <text x="140" y="368" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">1995</text>
  <text x="140" y="340" font-family="Arial" font-size="11" font-weight="bold" fill="#0088CC" text-anchor="middle">15</text>

  <!-- 2005: ~300 -->
  <rect x="220" y="330" width="80" height="20" fill="#0088CC"/>
  <text x="260" y="368" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">2005</text>
  <text x="260" y="325" font-family="Arial" font-size="11" font-weight="bold" fill="#0088CC" text-anchor="middle">300</text>

  <!-- 2015: 310 -->
  <rect x="340" y="328" width="80" height="22" fill="#0099DD"/>
  <text x="380" y="368" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">2015</text>
  <text x="380" y="323" font-family="Arial" font-size="11" font-weight="bold" fill="#0099DD" text-anchor="middle">310</text>

  <!-- 2020: ~3,000 -->
  <rect x="460" y="220" width="80" height="130" fill="#00AAEE"/>
  <text x="500" y="368" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">2020</text>
  <text x="500" y="210" font-family="Arial" font-size="11" font-weight="bold" fill="#00AAEE" text-anchor="middle">3,000</text>

  <!-- 2023: 5,297 -->
  <rect x="580" y="95" width="80" height="255" fill="#00BBAA"/>
  <text x="620" y="368" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">2023</text>
  <text x="620" y="85" font-family="Arial" font-size="12" font-weight="bold" fill="#00BBAA" text-anchor="middle">5,297</text>

  <!-- Exponential growth annotation -->
  <text x="400" y="380" font-family="Arial" font-size="13" fill="#CC0000" text-anchor="middle" font-style="italic">Exponential growth begins ~2017-2018</text>
</svg>
